<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Deutsch Video Factory</title>
</head>
<body style="font-family:Arial;padding:20px">

<h2>Video Settings</h2>

<label>Preset:
  <select id="preset">
    <option value="shorts">Shorts</option>
    <option value="lesson">Lesson</option>
    <option value="listening">Listening</option>
  </select>
</label>

<hr>

<label><input type="checkbox" id="showGerman"> German</label><br>
<label><input type="checkbox" id="showTurkish"> Turkish</label><br>
<label><input type="checkbox" id="showPronunciation"> Pronunciation</label><br>
<label><input type="checkbox" id="showWords"> Words</label><br>
<label><input type="checkbox" id="showSpeaker"> Speaker</label><br>

<br>
<button id="load">Load</button>
<button id="save">Save</button>
<button id="presetBtn">Apply Preset</button>

<pre id="out"></pre>

<script>
const $ = id => document.getElementById(id);

async function load() {
  const s = await window.settingsAPI.get();
  $("preset").value = s.preset;
  $("showGerman").checked = s.showGerman;
  $("showTurkish").checked = s.showTurkish;
  $("showPronunciation").checked = s.showPronunciation;
  $("showWords").checked = s.showWords;
  $("showSpeaker").checked = s.showSpeaker;
  $("out").textContent = JSON.stringify(s, null, 2);
}

async function save() {
  const data = {
    preset: $("preset").value,
    showGerman: $("showGerman").checked,
    showTurkish: $("showTurkish").checked,
    showPronunciation: $("showPronunciation").checked,
    showWords: $("showWords").checked,
    showSpeaker: $("showSpeaker").checked
  };
  const res = await window.settingsAPI.set(data);
  $("out").textContent = JSON.stringify(res, null, 2);
}

async function preset() {
  const res = await window.settingsAPI.applyPreset($("preset").value);
  $("out").textContent = JSON.stringify(res, null, 2);
}

$("load").onclick = load;
$("save").onclick = save;
$("presetBtn").onclick = preset;

load();
</script>
</body>
</html>
